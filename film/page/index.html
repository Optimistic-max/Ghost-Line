<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Line race film</title>
<link rel="stylesheet" href="../node_modules/cesium/Build/Cesium/Widgets/widgets.css">
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url('barlow.woff2') format('woff2'); }
  :root {
    --ghost: #FFE7A8; --today: #F47C5A; --text: #ECE7F2; --panel: rgba(23, 18, 31, 0.85); --ink: #17121F;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #17121F; }
  body { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: var(--text); }
  #halves { position: absolute; inset: 0; }
  .half { position: absolute; top: 0; width: 960px; height: 1080px; overflow: hidden; }
  #left { left: 0; } #right { left: 960px; }
  .half .cesium-viewer, .half .cesium-widget, .half canvas { width: 960px !important; height: 1080px !important; }
  /* Google / Cesium attribution: left exactly as Cesium draws it, never covered */
  .cesium-viewer-bottom { z-index: 50 !important; background: rgba(23, 18, 31, 0.85); padding: 3px 10px 3px 6px; border-radius: 0 8px 0 0; }
  #divider { position: absolute; left: 958px; top: 0; width: 4px; height: 1080px; background: var(--ink); z-index: 10; }
  #hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .panel { background: var(--panel); border-radius: 10px; }
  .side { position: absolute; top: 26px; padding: 14px 22px 16px; min-width: 290px; }
  #side1938 { left: 28px; } #sideToday { right: 28px; text-align: right; }
  .side .name { font-size: 58px; line-height: 0.95; letter-spacing: 0.5px; }
  .side .sub { font-size: 28px; opacity: 0.8; margin-top: 2px; }
  .side .wl { font-size: 28px; letter-spacing: 2px; opacity: 0.75; margin-top: 12px; }
  .side .watch { font-size: 66px; line-height: 1; margin-top: 0; font-variant-numeric: tabular-nums; letter-spacing: 1px; opacity: 0.92; }
  .side .watch.frozen { font-size: 74px; opacity: 1; text-shadow: 0 0 18px currentColor; }
  .side .state { font-size: 28px; letter-spacing: 2px; margin-top: 4px; min-height: 34px; }
  .c1938 { color: var(--ghost); } .ctoday { color: var(--today); }
  #clock { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); padding: 10px 26px 12px; text-align: center; z-index: 25; }
  #clock .t { font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #clock .t small { font-size: 30px; opacity: 0.8; }
  #badge { font-size: 28px; margin-top: 6px; opacity: 0.85; letter-spacing: 1px; }
  #tally { position: absolute; top: 500px; right: 28px; width: 330px; padding: 12px 18px 14px; text-align: right; }
  #tally .lbl { font-size: 28px; line-height: 1.1; opacity: 0.9; }
  #tally .row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 6px; }
  #tally .n { font-size: 64px; line-height: 1; color: var(--ghost); font-variant-numeric: tabular-nums; min-width: 40px; }
  .pip { width: 34px; height: 16px; border-radius: 8px 8px 5px 5px; border: 2px solid var(--ghost); opacity: 0.35; box-sizing: border-box; }
  .pip.on { background: var(--ghost); opacity: 1; box-shadow: 0 0 12px var(--ghost); }
  #event { position: absolute; top: 150px; left: 988px; padding: 10px 18px; font-size: 28px; color: var(--today); opacity: 0; }
  #svg { position: absolute; inset: 0; fill: #ECE7F2; }
  .plabel { font-size: 28px; fill: var(--text); paint-order: stroke; stroke: var(--ink); stroke-width: 6px; stroke-linejoin: round; }
  #caption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 46px; padding: 6px 22px 8px; width: 1840px; box-sizing: border-box; text-align: center; font-size: 28px; line-height: 1.18; }
  #caption .promo { font-size: 28px; opacity: 0.85; letter-spacing: 0.5px; }
  #rules { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); padding: 26px 40px; text-align: center; opacity: 0; }
  #rules .a { font-size: 46px; } #rules .b { font-size: 30px; opacity: 0.9; margin-top: 8px; }
  /* end card: pure graphic, no map imagery */
  #card { position: absolute; inset: 0; z-index: 100; background: var(--ink); display: none; }
  #card .head { position: absolute; left: 160px; right: 160px; top: 170px; font-size: 64px; line-height: 1.1; }
  #card .head .sub { display: block; font-size: 40px; opacity: 0.9; margin-top: 14px; }
  .bar { position: absolute; left: 160px; height: 86px; display: flex; }
  .bar .segs { display: flex; height: 100%; }
  .bar .seg { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--ink); overflow: hidden; white-space: nowrap; border-right: 3px solid var(--ink); }
  .bar .lane { position: absolute; left: -150px; width: 130px; text-align: right; top: 18px; font-size: 40px; }
  .bar .tot { position: absolute; top: 14px; opacity: 0; font-size: 48px; white-space: nowrap; }
  #card .foot { position: absolute; left: 160px; right: 160px; bottom: 90px; font-size: 28px; opacity: 0.75; }
  /* clean mode (thumbnail sources): no panels, labels or mini-maps; Cesium's credit strip stays */
  body.clean #hud .panel, body.clean #hud .plabel, body.clean #hud .mm { visibility: hidden !important; }
</style>
</head>
<body>
<div id="halves"><div class="half" id="left"></div><div class="half" id="right"></div></div>
<div id="divider"></div>
<div id="hud">
  <svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="side1938" class="side panel c1938"><div class="name">1938</div><div class="sub">No. 21 trackless trolley</div><div class="wl" id="wl1938"></div><div class="watch" id="w1938">00:00</div><div class="state" id="s1938"></div></div>
  <div id="sideToday" class="side panel ctoday"><div class="name">Today</div><div class="sub" id="subToday"></div><div class="wl" id="wlToday"></div><div class="watch" id="wToday">00:00</div><div class="state" id="sToday"></div></div>
  <div id="clock" class="panel"><div class="t" id="clockT">10:00:00 AM <small>· scheduled</small></div><div id="badge">×120 · 1 s = 2 min</div></div>
  <div id="tally" class="panel"><div class="lbl">1938 trolleys scheduled past this corner</div><div class="row"><span class="pip" id="p0"></span><span class="pip" id="p1"></span><span class="pip" id="p2"></span><span class="pip" id="p3"></span><span class="n" id="tallyN">0</span></div></div>
  <div id="event" class="panel"></div>
  <div id="rules" class="panel"><div class="a" id="rulesA"></div><div class="b" id="rulesB"></div></div>
  <div id="caption" class="panel"><div id="capText"></div><div class="promo" id="capPromo"></div></div>
</div>
<div id="card"></div>
<script src="../node_modules/cesium/Build/Cesium/Cesium.js"></script>
<script src="film-data.js"></script>
<script src="timeline.js"></script>
<script src="copy.js"></script>
<script src="film.js"></script>
</body>
</html>
