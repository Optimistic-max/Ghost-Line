[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Ghost Line race engine — builds JSON data from 1938 facts and MTA feed."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyproj>=3.6",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.92",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
# Timing tests assert wall-clock limits and can fail on a loaded machine, so a plain
# pytest run leaves them out. Run them alone with: python -m pipeline check --timing
addopts = "-m 'not timing'"
markers = [
    "requires_feed: reads the pinned feed zip in raw/; skipped with a visible warning when it is absent",
    "timing: asserts a wall-clock limit; excluded by default, run with python -m pipeline check --timing on a quiet machine",
]
