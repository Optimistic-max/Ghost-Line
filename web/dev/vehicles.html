<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle sheet (dev only)</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <style>
      /* Dev only, not part of the build: the vehicles at their sizes, for
         comparison with docs/planning/ui-mockups/18-trolley-sheet.png. */
      body {
        overflow: auto;
        padding: 24px;
      }
      .vehicle-sheet {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 32px 40px;
        padding: 28px;
        background: var(--panel);
        border-radius: 12px;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      figcaption {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="vehicle-sheet" id="sheet"></main>
    <script type="module" src="./vehicles.ts"></script>
  </body>
</html>
